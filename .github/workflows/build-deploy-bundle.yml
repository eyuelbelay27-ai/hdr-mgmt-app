name: Build deploy bundle

# Builds the app on GitHub's own runners (which have plenty of memory) and
# publishes only the finished, ready-to-run output to the `deploy` branch.
# The hosting platform then just starts that pre-built bundle instead of
# installing dependencies and building the app itself.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-deploy-bundle.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Assemble deploy bundle
        run: |
          set -e
          rm -rf ../deploy_out
          mkdir -p ../deploy_out
          cp -r .next/standalone/. ../deploy_out/
          mkdir -p ../deploy_out/.next
          cp -r .next/static ../deploy_out/.next/static
          cp -r public ../deploy_out/public
          cp -r node_modules/prisma ../deploy_out/node_modules/prisma
          cp -r prisma ../deploy_out/prisma
          node -e '
            const fs = require("fs");
            const path = "../deploy_out/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.scripts = pkg.scripts || {};
            pkg.scripts.start = "node node_modules/prisma/build/index.js migrate deploy && node server.js";
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          '

      - name: Publish to deploy branch
        working-directory: deploy_out
        run: |
          set -e
          git init -q
          git checkout -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy bundle from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy:deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
